<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>
    <iframe
        src="https://www.youtube-nocookie.com/embed/XfELJU1mRMg?autoplay=1&mute=1"
        title="Video"
        allow="autoplay; encrypted-media; fullscreen"
        allowfullscreen>
    </iframe>
</body>
</html>
